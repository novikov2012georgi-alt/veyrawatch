<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veyra Watch - Watch</title>

    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="watch.css">
</head>

<body>

    <header class="topbar watch-topbar">

        <div class="account-area">
            <div class="logo">
                Veyra Watch
            </div>

            <button id="backHomeButton" class="logout-button">
                Back to home
            </button>

            <button id="logoutButton" class="logout-button">
                Logout
            </button>
        </div>

        <div class="profile-area" id="profileArea">
            <div class="profile-icon" id="profileIcon">
                <span id="profileLetter">?</span>
            </div>
            <span class="profile-top-name" id="profileTopName"></span>
        </div>

    </header>

    <div class="watch-line"></div>

    <main class="watch-content">

        <div class="player-shell">
            <video id="watchVideo" playsinline></video>

            <button type="button" id="playPauseButton" class="player-center-button" aria-label="Play">
                <svg id="playIcon" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
                    <path fill="currentColor" d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" hidden>
                    <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
                </svg>
            </button>

            <button type="button" id="restartButton" class="player-center-button restart-button" aria-label="Restart" hidden>
                <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
                    <path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>

            <div class="player-controls">
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="player-controls-row">
                    <div class="player-time" id="playerTime">
                        0:00 / 0:00
                    </div>

                    <button type="button" id="fullscreenButton" class="fullscreen-button" aria-label="Fullscreen">
                        <svg id="enterFullscreenIcon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                        <svg id="exitFullscreenIcon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden>
                            <path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <h1 class="watch-title" id="watchTitle">Loading...</h1>

        <div class="watch-actions">
            <button type="button" id="subscribeButton" class="watch-action-button">
                Subscribe
            </button>

            <button type="button" id="likeButton" class="watch-action-button">
                Like <span id="likeCount">0</span>
            </button>

            <button type="button" id="dislikeButton" class="watch-action-button">
                Dislike <span id="dislikeCount">0</span>
            </button>

            <span class="watch-comments-count">
                Comments <span id="commentCount">0</span>
            </span>
        </div>

        <p class="watch-meta" id="watchMeta"></p>
        <p class="watch-views" id="watchViews"></p>
        <p class="watch-description" id="watchDescription"></p>

        <section class="comments-section">
            <h2 class="comments-title">Comments</h2>

            <form id="commentForm" class="comment-form">
                <textarea
                    id="commentInput"
                    rows="3"
                    maxlength="2000"
                    placeholder="Write a comment..."
                ></textarea>
                <button type="submit" class="watch-action-button comment-submit">
                    Comment
                </button>
            </form>

            <div id="commentsList" class="comments-list"></div>
        </section>

    </main>

    <script src="home.js"></script>
    <script src="watch.js"></script>

</body>
</html>
